# -------------------------------
# 1️⃣ Deployment
# -------------------------------
deployment:
  replicas: 3  # tăng lên 3 để trải across AZ
  podAnnotations: {}
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
          topologyKey: "kubernetes.io/hostname"

# -------------------------------
# 2️⃣ Service LoadBalancer
# -------------------------------
service:
  type: LoadBalancer
  externalTrafficPolicy: Local  # preserve client IP
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"  # public NLB
  ports:
    web:
      port: 80
    websecure:
      port: 443

# -------------------------------
# 3️⃣ Providers
# -------------------------------
providers:
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: true

# -------------------------------
# 4️⃣ Dashboard
# -------------------------------
dashboard:
  enabled: true
  domain: "phamdatzx.id.vn"  # domain thực tế
  # EntryPoint mặc định là websecure (443)
entryPoints:
  web:
    address: ":80"

# Expose Dashboard qua IngressRoute
ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`phamdatzx.id.vn`)
    entryPoints: ["web"]


# -------------------------------
# 5️⃣ Logs
# -------------------------------
logs:
  general:
    level: INFO
    access:
    enabled: true

# -------------------------------
# 6️⃣ Additional arguments
# -------------------------------
additionalArguments:
  - "--api.dashboard=true"

# -------------------------------
# 7️⃣ CRDs & RBAC
# -------------------------------
crds:
  enabled: true

rbac:
  enabled: true
